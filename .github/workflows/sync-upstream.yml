name: Sync upstream

# Keeps this fork's main branch up to date with JustVugg/colibri main.

on:
  schedule:
    - cron: "17 4 * * *" # every day at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository != 'JustVugg/colibri'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main into fork main
        env:
          # The default token cannot push upstream commits that touch
          # .github/workflows. Add a SYNC_TOKEN secret (a PAT with the
          # "workflow" scope) if that happens.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/merge-upstream" \
            -f branch=main
